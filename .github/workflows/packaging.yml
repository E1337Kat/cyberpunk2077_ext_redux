# Tests and packages every push to main, and uploads a release archive when the
# push carries a release commit.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Package

on:
  push:
    branches: [main]

# Replaces styfle/cancel-workflow-action. Runs queue instead of cancelling, so a
# release build is never killed by the push that follows it.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 16.x
          cache: "npm"
      # --ignore-scripts skips the node-gyp build of winapi-bindings (pulled in
      # by the exe-version peer dependency). That binary is a webpack external
      # supplied by Vortex at runtime, so nothing we build or test loads it, and
      # its pinned node-gyp 9 cannot find the Visual Studio on current runner
      # images. It also skips husky's git hook install, which CI has no use for.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run The Tests
        run: npm run test

  package-dev:
    name: Package Dev Build
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 16.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: package it up
        run: npm run pack-dev

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-release-zip
          path: "cyberpunk2077-dev-*.7z"

  package-release:
    name: Package
    needs: [test]
    if: "(contains(github.event.commits[0].message, 'release') || contains(github.event.commits[1].message, 'release')) && !contains(github.event.commits[0].message, 'gonk')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 16.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: package it up
        run: npm run pack

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: "cyberpunk2077-*.7z"
