name: Package

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also package a release artifact"
        type: boolean
        default: false

jobs:
  package-dev:
    name: Package Dev Build
    runs-on: windows-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v4
        with:
          # package.mjs stamps the archive with the commit it was built from
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build doesn't typecheck, so this has to be its own step
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Package it up
        run: pnpm run pack-dev

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-zip
          path: "game-cyberpunk2077-dev-*.7z"

  package-release:
    name: Package
    needs: [package-dev]
    if: inputs.release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pack` runs the tests itself before building
      - name: Package it up
        run: pnpm run pack

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: "game-cyberpunk2077-*.7z"