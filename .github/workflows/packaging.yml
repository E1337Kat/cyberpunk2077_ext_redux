name: Package

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also package a release artifact"
        type: boolean
        default: false

# Replaces styfle/cancel-workflow-action. Runs queue instead of cancelling, so a
# release build is never killed by the push that follows it.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-dev:
    name: Package Dev Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # package.mjs stamps the archive with the commit it was built from
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build doesn't typecheck, so this has to be its own step
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Package it up
        run: pnpm run pack-dev

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-release-zip
          path: "game-cyberpunk2077-dev-*.7z"

  package-release:
    name: Package
    needs: [package-dev]
    if: inputs.release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pack` runs the tests itself before building
      - name: Package it up
        run: pnpm run pack

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: "game-cyberpunk2077-*.7z"
