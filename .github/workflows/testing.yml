name: Testing

on:
  pull_request:
    branches:
      - main
      - "**"
  workflow_dispatch:

# Replaces styfle/cancel-workflow-action: a new push to the same PR cancels the
# run that is still in flight.
concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build doesn't typecheck, so this has to be its own step
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
