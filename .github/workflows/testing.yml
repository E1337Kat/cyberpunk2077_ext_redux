# Runs the Jest suite against every pull request.
# Pushes to main are covered by packaging.yml, so they are not handled here.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Testing

on:
  pull_request:
    branches:
      - main
      - "**"

# Replaces styfle/cancel-workflow-action: a new push to the same PR cancels the
# run that is still in flight.
concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 16.x
          cache: "npm"
      # --ignore-scripts skips the node-gyp build of winapi-bindings (pulled in
      # by the exe-version peer dependency). That binary is a webpack external
      # supplied by Vortex at runtime, so nothing we build or test loads it, and
      # its pinned node-gyp 9 cannot find the Visual Studio on current runner
      # images. It also skips husky's git hook install, which CI has no use for.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run The Tests
        run: npm run test
